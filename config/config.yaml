# Select bowtie2_legacy or NTM_bwamem. Use separate results_dir values per route.
analysis_route: bowtie2_legacy

samplesheet: config/samplesheet.csv
results_dir: results
python_bin: python
cli_module: src.cli

threads:
  trim_reads: 1
  # bowtie2 + samtools_sort form one job (core_align_and_sort). With the
  # SAM-to-sort streaming fix, throughput scales best with many parallel
  # sample jobs at modest per-job threads: 8 + 2 threads x -j 24 ~= 240 CPUs.
  bowtie2: 8
  bwa: 8
  samtools_sort: 2
  depth_metrics: 1
  call_variants: 1
  diff_loci: 1
  recall: 1
  merge: 1
  wild_extract: 1
  filter_core: 1
  # Pairwise SNP distance uses the compiled snp-dists tool, which accepts
  # -j threads. Only one distance job exists, so give it spare CPUs.
  distance: 8

workflow:
  verbose: false
  run_id: latest

report:
  strict: false
  skip_lineage: false
  skip_figures: false
  skip_tables: false

core_gate:
  min_mean_depth: 10
  min_coverage_fraction: 0.95

references:
  active: tb_ancestor
  profiles:
    tb_ancestor:
      fasta: data/tb.ancestor.fasta
      fai: data/tb.ancestor.fasta.fai
      bowtie2_index: data/bowtie2_index/tb.ancestor.fasta
      wildtype_fasta: data/tb.ancestor.fasta
      genome_length: 4411532
    tb_h37rv:
      fasta: data/tb_h37rv.fasta
      fai: data/tb_h37rv.fasta.fai
      bowtie2_index: data/bowtie2_index/tb_h37rv.fasta
      wildtype_fasta: data/tb_h37rv.fasta
      genome_length: 4411532
  ppe_list: data/PPE_INS_loci_Rv.list
  varscan_jar: src/scripts/VarScan.v2.3.9.jar
  lineage_rules: data/lineage/typing_SNP.tsv

compat:
  legacy_results_dir: results_legacy
