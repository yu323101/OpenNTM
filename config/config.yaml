# Select TB_bowtie2 or NTM_bwamem. Use separate results_dir values per route.
analysis_route: TB_bowtie2

samplesheet: config/samplesheet.csv
results_dir: results
python_bin: python
cli_module: src.cli

threads:
  trim_reads: 1
  # bowtie2 + samtools_sort form one job (core_align_and_sort). With the
  # SAM-to-sort streaming fix, throughput scales best with many parallel
  # sample jobs at modest per-job threads: 8 + 2 threads x -j 24 ~= 240 CPUs.
  bowtie2: 8
  bwa: 8
  samtools_sort: 2
  depth_metrics: 1
  call_variants: 1
  diff_loci: 1
  recall: 1
  merge: 1
  wild_extract: 1
  filter_core: 1
  # Threads passed to snp-dists for pairwise SNP distances. Default is 1;
  # increase this value (for example, to 4 or 8) when more CPU is available.
  distance: 1
  # Lightweight serial extension rules; these values are Snakemake scheduling
  # slots, not internal parallelism controls.
  cluster: 1
  drug_resistance: 1
  investigation_alerts: 1

workflow:
  verbose: false
  run_id: latest

report:
  strict: false
  skip_lineage: false
  skip_figures: false
  skip_tables: false
  # Set true to omit cluster/resistance/alert rules from the Snakemake DAG.
  # The CLI flag --skip-extensions has the same effect for build-reports.
  skip_extensions: false

# Epidemiology-supporting outputs. These are screening and triage aids, not
# standalone proof of transmission or phenotypic drug susceptibility.
clustering:
  # Use only for samples processed against a comparable reference and variant
  # definition. For NTM, choose an appropriate NTM reference/threshold first
  # and interpret clusters with epidemiological records.
  snp_threshold: 12

drug_resistance:
  # This bundled marker table and MTB resistance categories are for MTB/TB
  # data only. Do not interpret these results for NTM; use a validated,
  # species-specific NTM database and phenotypic DST instead.
  database: data/drug_db/Total_drug_resistance_mutation.txt

core_gate:
  min_mean_depth: 10
  min_coverage_fraction: 0.95

references:
  active: tb_ancestor
  profiles:
    tb_ancestor:
      # Name written on the reference row of the core SNP alignment.
      label: tb.ancestor
      fasta: data/tb.ancestor.fasta
      fai: data/tb.ancestor.fasta.fai
      bowtie2_index: data/bowtie2_index/tb.ancestor.fasta
      wildtype_fasta: data/tb.ancestor.fasta
      genome_length: 4411532
    tb_h37rv:
      label: H37Rv
      fasta: data/tb_h37rv.fasta
      fai: data/tb_h37rv.fasta.fai
      bowtie2_index: data/bowtie2_index/tb_h37rv.fasta
      wildtype_fasta: data/tb_h37rv.fasta
      genome_length: 4411532
  ppe_list: data/PPE_INS_loci_Rv.list
  varscan_jar: src/scripts/VarScan.v2.3.9.jar
  lineage_rules: data/lineage/typing_SNP.tsv

compat:
  legacy_results_dir: results_legacy
