name: mtb-evo
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - pip
  - sickle-trim
  - bowtie2
  - samtools
  - varscan
  - fasttree
  # Pairwise SNP distance calculator; the workflow passes threads from YAML.
  - snp-dists
  - perl
  - snakemake-minimal
  - pip:
      - biopython==1.81
      - typer
      - pydantic
      - pyyaml
      - matplotlib
