name: mtb-evo
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - pip
  - sickle-trim
  - bwa
  - samtools
  - varscan
  - fasttree
  # Compiled pairwise SNP distance calculator used by the core distance rule.
  - snp-dists=1.2.0
  - perl
  - snakemake-minimal
  - pip:
      - biopython==1.81
      - typer
      - pydantic
      - pyyaml
      - matplotlib
