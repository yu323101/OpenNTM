name: mtb-evo
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - pip
  # Bioinformatics tools
  - sickle-trim
  - bwa
  - samtools
  - varscan
  - fasttree
  - fastp
  # Compiled pairwise SNP distance calculator used by the core distance rule.
  - snp-dists=1.2.0
  # Perl
  - perl
  - snakemake-minimal
  # Python table/report deps
  - pandas
  # R deps for legacy figure scripts
  - r-base
  - r-ggplot2
  - r-jsonlite
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-scales
  # Python packages (使用 pip 安装避免 channel 冲突)
  - pip:
    - biopython==1.81
    - typer
    - pydantic
    - pyyaml
    - matplotlib
  # Development
  - pytest
  - black
  - ruff
